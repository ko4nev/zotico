
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOTICO — Подарок для вашего питомца</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FAF8F5;
    color: #2C2C2A;
    min-height: 100vh;
  }
  .hero { padding: 36px 24px 40px; text-align: center; }
  .brand { font-size: 13px; letter-spacing: 4px; color: #888780; margin-bottom: 20px; text-transform: uppercase; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 1px; padding: 6px 16px; border-radius: 20px; margin-bottom: 24px; text-transform: uppercase; }
  .hero h1 { font-size: 32px; font-weight: 800; line-height: 1.25; margin-bottom: 14px; text-shadow: 0 1px 8px rgba(0,0,0,0.15); }
  .hero-sub { font-size: 17px; color: rgba(255,255,255,0.92); line-height: 1.55; margin-top: 18px; font-weight: 500; }
  .benefits { padding: 32px 24px; background: #FAF8F5; }
  .benefits-title { font-size: 14px; color: #888780; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; text-align: center; }
  .benefit-item { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .benefit-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: #2C2C2A; }
  .benefit-text h3 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .benefit-text p { font-size: 13px; color: #888780; line-height: 1.5; }
  .divider { height: 1px; background: #E8E5DF; margin: 0 24px; }
  .form-section { padding: 32px 24px; }
  .form-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .form-sub { font-size: 14px; color: #888780; text-align: center; margin-bottom: 24px; line-height: 1.5; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: #888780; margin-bottom: 6px; font-weight: 500; }
  .form-group input {
    width: 100%; padding: 14px 16px;
    border: 1.5px solid #E8E5DF; border-radius: 12px;
    font-size: 16px; background: #fff; color: #2C2C2A;
    outline: none; transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .form-group input:focus { border-color: #2C2C2A; }
  .form-group input::placeholder { color: #C8C6BE; }
  .consent { display: flex; align-items: flex-start; gap: 12px; margin: 20px 0 24px; }
  .consent input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; accent-color: #2C2C2A; cursor: pointer; }
  .consent label { font-size: 12px; color: #888780; line-height: 1.6; cursor: pointer; }
  .consent a { color: #2C2C2A; text-decoration: underline; }

  .btn-main {
    width: 100%; padding: 18px; color: #FAF8F5; border: none;
    border-radius: 14px; font-size: 17px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 10px;
    transition: opacity 0.2s, transform 0.1s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-main:active:not(:disabled) { opacity: 0.85; transform: scale(0.98); }

  /* Неактивное состояние кнопки */
  .btn-main:disabled {
    background: #C8C6BE !important;
    cursor: not-allowed;
    transform: none;
    opacity: 1;
  }

  .footer { padding: 24px; text-align: center; }
  .footer p { font-size: 12px; color: #C8C6BE; line-height: 1.7; }
  .footer a { color: #888780; text-decoration: underline; }

  .success-screen {
    display: none; padding: 60px 24px; text-align: center;
    min-height: 80vh; align-items: center; justify-content: center; flex-direction: column;
  }
  .success-screen.show { display: flex; }
  .success-icon { font-size: 56px; margin-bottom: 20px; }
  .success-screen h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  .success-screen p { font-size: 15px; color: #888780; line-height: 1.6; margin-bottom: 32px; }
  .btn-tg {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px; background: #2C2C2A; color: #FAF8F5;
    border-radius: 14px; font-size: 16px; font-weight: 600; text-decoration: none;
  }
  .main-content.hide { display: none; }
  .field-error { font-size: 12px; color: #E24B4A; margin-top: 5px; display: none; }
  .field-error.show { display: block; }
  .input-err { border-color: #E24B4A !important; }
</style>
</head>
<body>

<div class="main-content" id="mainContent">
  <div class="hero" id="heroBlock">
    <p class="brand">ZOTICO</p>
    <span class="badge" id="heroBadge"></span>
    <h1 id="heroTitle"></h1>
    <p class="hero-sub" id="heroSub"></p>
  </div>

  <div class="benefits">
    <p class="benefits-title" id="benefitsTitle"></p>
    <div id="benefitsList"></div>
  </div>

  <div class="divider"></div>

  <div class="form-section">
    <h2 class="form-title">Получить бесплатно</h2>
    <p class="form-sub" id="formSub"></p>

    <div class="form-group">
      <label for="name">Ваше имя</label>
      <input type="text" id="name" placeholder="Например, Анна" autocomplete="given-name">
      <p class="field-error" id="nameError">Пожалуйста, введите имя</p>
    </div>
    <div class="form-group">
      <label for="phone">Номер телефона</label>
      <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" autocomplete="tel">
      <p class="field-error" id="phoneError">Введите корректный номер телефона</p>
    </div>

    <div class="consent">
      <input type="checkbox" id="consent">
      <label for="consent">
        Нажимая кнопку, я соглашаюсь с <a href="privacy.html" target="_blank">политикой конфиденциальности</a> и даю <a href="consent.html" target="_blank">согласие на обработку персональных данных</a> и получение информационных сообщений от ZOTICO
      </label>
    </div>

    <button class="btn-main" id="submitBtn" onclick="handleSubmit()" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8l-1.7 8.02c-.12.56-.46.7-.93.43l-2.57-1.9-1.24 1.19c-.14.14-.25.25-.51.25l.18-2.57 4.65-4.2c.2-.18-.04-.28-.31-.1L7.9 14.49l-2.52-.79c-.55-.17-.56-.55.12-.81l9.86-3.8c.46-.17.86.11.28.71z" fill="#FAF8F5"/>
      </svg>
      <span id="btnText">Получить в Telegram</span>
    </button>
  </div>

  <div class="footer">
    <p>ZOTICO · Зоотовары с любовью к питомцам<br>
    <a href="privacy.html" target="_blank">Политика конфиденциальности</a> · <a href="consent.html" target="_blank">Согласие на обработку ПД</a></p>
  </div>
</div>

<div class="success-screen" id="successScreen">
  <div class="success-icon" id="successIcon">🐶</div>
  <h2 id="successTitle">Отлично!</h2>
  <p id="successText">Перейдите в Telegram-бота — он пришлёт всё прямо сейчас.</p>
  <a href="#" id="tgLink" class="btn-tg">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8l-1.7 8.02c-.12.56-.46.7-.93.43l-2.57-1.9-1.24 1.19c-.14.14-.25.25-.51.25l.18-2.57 4.65-4.2c.2-.18-.04-.28-.31-.1L7.9 14.49l-2.52-.79c-.55-.17-.56-.55.12-.81l9.86-3.8c.46-.17.86.11.28.71z" fill="#FAF8F5"/>
    </svg>
    Открыть Telegram-бота
  </a>
</div>

<script>
const offers = {
  '10games': {
    heroColor: '#2C2C2A', badgeColor: '#C4A882', badgeTextColor: '#2C2C2A',
    badge: '🎁 Подарок покупателю',
    title: '10 игр с собакой,\nкоторые <span style="color:#C4A882">снижают стресс</span>\nи тратят энергию дома',
    heroSub: 'Бесплатный PDF-гайд — только для покупателей ZOTICO',
    benefitsTitle: 'Что внутри гайда',
    benefits: [
      { icon: '🐾', title: 'Для любой породы и возраста', text: 'Игры подобраны для щенков, взрослых и пожилых собак' },
      { icon: '🏠', title: 'Без специнвентаря', text: 'Нужна только игрушка и немного времени — ничего покупать не нужно' },
      { icon: '❤️', title: 'Меньше скуки и тревоги', text: 'Игры снижают стресс у питомца и укрепляют вашу связь' }
    ],
    formSub: 'Оставьте имя и номер — пришлём PDF прямо в Telegram за 30 секунд',
    btnText: 'Получить PDF в Telegram',
    tgStart: 'leaflet_10games',
    successIcon: '📖', successTitle: 'Готово, {{name}}!',
    successText: 'Перейдите в Telegram-бота — он пришлёт вам PDF с играми прямо сейчас.'
  },
  'psychotype': {
    heroColor: '#3C3489', badgeColor: '#AFA9EC', badgeTextColor: '#26215C',
    badge: '🧠 Мини-тест',
    title: 'Определите\n<span style="color:#FFD84D">психотип</span>\nвашей собаки',
    heroSub: 'Узнайте характер питомца и получите советы под его тип личности',
    benefitsTitle: 'Что вы узнаете',
    benefits: [
      { icon: '🐕', title: 'Тип личности вашей собаки', text: '5 вопросов — и вы поймёте, почему она ведёт себя именно так' },
      { icon: '💡', title: 'Советы под характер', text: 'Как играть, обучать и успокаивать именно вашего питомца' },
      { icon: '🎯', title: 'Индивидуальный результат', text: 'Не общие советы, а рекомендации под конкретный психотип' }
    ],
    formSub: 'Оставьте имя и номер — пришлём тест прямо в Telegram за 30 секунд',
    btnText: 'Пройти тест в Telegram',
    tgStart: 'leaflet_psychotype',
    successIcon: '🧠', successTitle: 'Отлично, {{name}}!',
    successText: 'Перейдите в Telegram-бота — он запустит тест прямо сейчас.'
  },
  'horoscope': {
    heroColor: '#533AB7', badgeColor: '#AFA9EC', badgeTextColor: '#26215C',
    badge: '✨ Собачий гороскоп',
    title: '<span style="color:#FFD84D">Собачий\nгороскоп</span>\nдля вашего питомца',
    heroSub: 'Даже если вы не верите в гороскопы — это просто весело 🐾',
    benefitsTitle: 'Что вас ждёт',
    benefits: [
      { icon: '⭐', title: 'Гороскоп по породе и знаку', text: 'Введите знак зодиака питомца — получите его персональный прогноз' },
      { icon: '😄', title: 'Просто для настроения', text: 'Немного юмора, немного правды — и много узнаваемого про вашу собаку' },
      { icon: '🎁', title: 'Бонус внутри', text: 'В гороскопе — подборка игрушек, идеально подходящих по темпераменту вашей собаки' }
    ],
    formSub: 'Оставьте имя и номер — пришлём гороскоп прямо в Telegram за 30 секунд',
    btnText: 'Получить гороскоп в Telegram',
    tgStart: 'dl-1782134639303',
    successIcon: '🔮', successTitle: 'Звёзды ждут, {{name}}!',
    successText: 'Перейдите в Telegram-бота — он пришлёт гороскоп вашего питомца прямо сейчас.'
  }
};

const params = new URLSearchParams(window.location.search);
const utmContent = params.get('utm_content') || '10games';
const utmSource  = params.get('utm_source')  || 'direct';
const offer = offers[utmContent] || offers['10games'];

// Рендер контента
document.querySelector('.hero').style.background = offer.heroColor;
document.querySelector('.hero').style.color = '#FAF8F5';
const badge = document.getElementById('heroBadge');
badge.textContent = offer.badge;
badge.style.background = offer.badgeColor;
badge.style.color = offer.badgeTextColor;
document.getElementById('heroTitle').innerHTML = offer.title.replace(/\n/g, '<br>');
document.getElementById('heroSub').textContent = offer.heroSub;
document.getElementById('benefitsTitle').textContent = offer.benefitsTitle;
document.getElementById('formSub').textContent = offer.formSub;
document.getElementById('btnText').textContent = offer.btnText;
document.getElementById('submitBtn').style.background = offer.heroColor;

const list = document.getElementById('benefitsList');
offer.benefits.forEach(b => {
  list.innerHTML += `<div class="benefit-item"><div class="benefit-icon">${b.icon}</div><div class="benefit-text"><h3>${b.title}</h3><p>${b.text}</p></div></div>`;
});

// ── ВАЛИДАЦИЯ В РЕАЛЬНОМ ВРЕМЕНИ ─────────────────────────────────────────────
function checkForm() {
  const name    = document.getElementById('name').value.trim();
  const phone   = document.getElementById('phone').value.replace(/\D/g,'');
  const consent = document.getElementById('consent').checked;
  const btn     = document.getElementById('submitBtn');
  const ready   = name.length > 0 && phone.length >= 11 && consent;
  btn.disabled  = !ready;
  btn.style.background = ready ? offer.heroColor : '#C8C6BE';
}

document.getElementById('name').addEventListener('input', checkForm);
document.getElementById('consent').addEventListener('change', checkForm);

// Маска телефона + валидация
document.getElementById('phone').addEventListener('input', function(e) {
  let val = e.target.value.replace(/\D/g, '');
  if (val.startsWith('8')) val = '7' + val.slice(1);
  if (val.startsWith('7')) {
    let f = '+7';
    if (val.length > 1) f += ' (' + val.slice(1,4);
    if (val.length >= 4) f += ') ' + val.slice(4,7);
    if (val.length >= 7) f += '-' + val.slice(7,9);
    if (val.length >= 9) f += '-' + val.slice(9,11);
    e.target.value = f;
  }
  checkForm();
});

// ── ОТПРАВКА ─────────────────────────────────────────────────────────────────
function handleSubmit() {
  const name  = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const btn   = document.getElementById('submitBtn');

  btn.disabled = true;
  document.getElementById('btnText').textContent = 'Сохраняем...';
  btn.style.background = '#C8C6BE';

  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxil7jpHMJeOPqRZDsJjbflxi_hhRqiKYHB0QF4KXkxVoAAz4OiwfOzR7JLCDV__Rtd/exec';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name, phone, consent: true,
      utm_source: utmSource, utm_content: utmContent,
      offer_name: offer.badge,
      timestamp: new Date().toLocaleString('ru-RU')
    })
  }).catch(() => {});

  setTimeout(() => {
    document.getElementById('mainContent').classList.add('hide');
    const s = document.getElementById('successScreen');
    s.classList.add('show');
    document.getElementById('successIcon').textContent = offer.successIcon;
    document.getElementById('successTitle').textContent = offer.successTitle.replace('{{name}}', name);
    document.getElementById('successText').textContent = offer.successText;
    document.getElementById('tgLink').href = 'https://t.me/zotico_pets_bot?start=' + offer.tgStart;
  }, 800);
}
</script>
</body>
</html>
